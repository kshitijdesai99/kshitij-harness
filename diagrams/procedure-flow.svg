<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Database procedure flow</title>
  <desc id="description">Evidence-backed background learning may save versioned database references. Recall selects the top relevant current procedure: its complete body and provenance enter automatically only when the remaining shared memory budget fits them. Assets remain unloaded. Otherwise compact metadata provides an explicit load pointer; explicit loading can retrieve assets. These are reference data, never execution authority or a general project-skills router. Execution requires a separate user request and ordinary approved tools.</desc>
  <rect width="1400" height="850" fill="#f8fafc"/>
  <text x="60" y="58" font-size="32" font-weight="700" fill="#0f172a">Database procedure flow</text>
  <text x="60" y="95" font-size="19" fill="#475569">Purple: background learning. Green / blue: reference data. Dashed amber: separately requested execution.</text>

  <line x1="430" y1="210" x2="478" y2="210" stroke="#8b5cf6" stroke-width="3"/>
  <polygon points="490,210 477,203 477,217" fill="#8b5cf6"/>
  <line x1="860" y1="210" x2="908" y2="210" stroke="#8b5cf6" stroke-width="3"/>
  <polygon points="920,210 907,203 907,217" fill="#8b5cf6"/>
  <polyline points="1130,280 1130,330 245,330 245,378" fill="none" stroke="#059669" stroke-width="3"/>
  <polygon points="245,390 238,377 252,377" fill="#059669"/>
  <rect x="555" y="314" width="278" height="30" fill="#f8fafc"/>
  <text x="570" y="336" font-size="18" fill="#047857">Selective, budget-bound recall</text>
  <line x1="430" y1="465" x2="478" y2="465" stroke="#2563eb" stroke-width="3"/>
  <polygon points="490,465 477,458 477,472" fill="#2563eb"/>
  <text x="441" y="445" font-size="18" fill="#2563eb">fits</text>
  <line x1="245" y1="540" x2="245" y2="628" stroke="#2563eb" stroke-width="3"/>
  <polygon points="245,640 238,627 252,627" fill="#2563eb"/>
  <rect x="208" y="573" width="75" height="30" fill="#f8fafc"/>
  <text x="219" y="595" font-size="18" fill="#2563eb">no fit</text>
  <polyline points="430,700 675,700 675,552" stroke="#2563eb" stroke-width="3" fill="none"/>
  <polygon points="675,540 668,553 682,553" fill="#2563eb"/>
  <rect x="473" y="685" width="128" height="30" fill="#f8fafc"/>
  <text x="485" y="707" font-size="18" fill="#2563eb">explicit load</text>
  <polyline points="860,465 1130,465 1130,628" stroke="#d97706" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <polygon points="1130,640 1123,627 1137,627" fill="#d97706"/>
  <rect x="967" y="553" width="326" height="30" fill="#f8fafc"/>
  <text x="980" y="575" font-size="18" font-weight="700" fill="#b45309">Only on separate user request</text>

  <rect x="60" y="150" width="370" height="130" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="80" y="190" font-size="22" font-weight="700" fill="#0f172a">Successful evidence</text>
  <text x="80" y="224" font-size="18" fill="#334155">Two distinct successful tool outputs</text>
  <text x="80" y="253" font-size="18" fill="#334155">Required, not sufficient</text>

  <rect x="490" y="150" width="370" height="130" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="510" y="190" font-size="22" font-weight="700" fill="#0f172a">Selective extraction</text>
  <text x="510" y="224" font-size="18" fill="#334155">Useful, verified workflow only</text>
  <text x="510" y="253" font-size="18" fill="#334155">May decline; validate before saving</text>

  <rect x="920" y="150" width="420" height="130" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="940" y="190" font-size="22" font-weight="700" fill="#0f172a">Versioned DB reference</text>
  <text x="940" y="224" font-size="18" fill="#334155">Procedure · provenance · inert assets</text>
  <text x="940" y="253" font-size="18" fill="#334155">CLI put/import also store here</text>

  <rect x="60" y="390" width="370" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="80" y="432" font-size="22" font-weight="700" fill="#0f172a">Top-1 relevant procedure</text>
  <text x="80" y="469" font-size="18" fill="#334155">Current · active · complete body</text>
  <text x="80" y="506" font-size="18" fill="#334155">Fits remaining shared total?</text>

  <rect x="490" y="390" width="370" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="510" y="432" font-size="22" font-weight="700" fill="#0f172a">Complete inert body</text>
  <text x="510" y="469" font-size="18" fill="#334155">Whole procedure + provenance</text>
  <text x="510" y="506" font-size="18" fill="#334155">Assets: explicit load only</text>

  <rect x="60" y="640" width="370" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="80" y="683" font-size="22" font-weight="700" fill="#0f172a">Compact metadata</text>
  <text x="80" y="720" font-size="18" fill="#334155">Load pointer: ID or name / alias</text>

  <rect x="920" y="640" width="420" height="120" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="940" y="683" font-size="22" font-weight="700" fill="#0f172a">Normal-tool execution</text>
  <text x="940" y="720" font-size="18" fill="#334155">Command approval + OS permissions</text>

  <text x="60" y="814" font-size="18" fill="#475569">No execution authority or general router. Project skills remain model-selected. Save / load / import never execute.</text>
</svg>
