<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" font-family="Helvetica, Arial, sans-serif">
  <title>kh memory architecture</title>
  <desc>Selective memory hooks, append-only provenance, opt-in hybrid retrieval, inert procedural references and bounded chat context.</desc>
  <defs>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 19px; fill: #475569; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .rule { stroke: #e2e8f0; stroke-width: 1.5; }
      .num { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .b { font-size: 18px; fill: #334155; }
      .s { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .m { font-size: 17px; fill: #0f172a; font-family: Menlo, Consolas, monospace; }
      .l { font-size: 17px; fill: #334155; font-weight: 600; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; }
      .foot { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1480" fill="#f8fafc"/>
  <text x="55" y="62" class="title">kh memory architecture</text>
  <text x="55" y="94" class="sub">Selective, append-only, local SQLite memory. Arrows show the direction of data flow; a two-headed arrow is a call and its result.</text>

  <!-- Card 1: chat turn -->
  <rect x="55" y="120" width="430" height="480" rx="16" class="card"/>
  <circle cx="91" cy="162" r="18" fill="#2563eb"/>
  <text x="91" y="169" class="num" text-anchor="middle">1</text>
  <text x="125" y="170" class="h">Chat turn</text>
  <line x1="75" y1="192" x2="465" y2="192" class="rule"/>
  <text x="75" y="228" class="s">Every nonempty user query:</text>
  <text x="75" y="255" class="b">initial, steering or queued</text>
  <text x="75" y="282" class="b">After images, before provider.Step,</text>
  <text x="75" y="309" class="b">BeforeMessage does two things:</text>
  <text x="75" y="336" class="b">• queues the pre-hook (card 2)</text>
  <text x="75" y="363" class="b">• recalls memory now (card 5)</text>
  <text x="75" y="390" class="b">A recall error aborts the message</text>
  <text x="75" y="444" class="s">When a turn completes:</text>
  <text x="75" y="471" class="b">• post-hook, if the reply is nonempty</text>
  <text x="75" y="498" class="b">• summary rebuild check</text>
  <text x="75" y="525" class="b">Recent context: bounded last exchange,</text>
  <text x="75" y="552" class="b">not a second transcript archive</text>

  <!-- Card 2: hooks -->
  <rect x="585" y="120" width="430" height="480" rx="16" class="card"/>
  <circle cx="621" cy="162" r="18" fill="#7c3aed"/>
  <text x="621" y="169" class="num" text-anchor="middle">2</text>
  <text x="655" y="170" class="h">Selective hooks</text>
  <line x1="605" y1="192" x2="995" y2="192" class="rule"/>
  <text x="605" y="228" class="b">One background worker, jobs in order</text>
  <text x="605" y="255" class="b">Tool-less memory_model call, JSON out</text>
  <text x="605" y="282" class="s">Pre-hook: query + recent context</text>
  <text x="605" y="309" class="s">Post-hook: query + recent context</text>
  <text x="605" y="336" class="b">+ tool evidence + final reply</text>
  <text x="605" y="390" class="s">Saves only durable knowledge:</text>
  <text x="605" y="417" class="b">instruction · fact · decision · gotcha</text>
  <text x="605" y="444" class="b">Routine discussion: {"save":[]}</text>
  <text x="605" y="471" class="b">Each note keeps a context_summary</text>
  <text x="605" y="498" class="b">Rejected: stale reads, hook kind changes,</text>
  <text x="605" y="525" class="b">secrets; peer messages are not learned</text>
  <text x="605" y="552" class="b">Every save shows as a (memory) notice</text>
  <text x="605" y="579" class="b">User chats learn; workers only retrieve</text>

  <!-- Card 3: store -->
  <rect x="1115" y="120" width="430" height="480" rx="16" class="card"/>
  <circle cx="1151" cy="162" r="18" fill="#0f766e"/>
  <text x="1151" y="169" class="num" text-anchor="middle">3</text>
  <text x="1185" y="170" class="h">SQLite store</text>
  <line x1="1135" y1="192" x2="1525" y2="192" class="rule"/>
  <text x="1135" y="228" class="b">~/.kh/memory.db, append-only notes:</text>
  <text x="1135" y="255" class="b">a change adds a row, never edits one</text>
  <text x="1135" y="282" class="s">Columns:</text>
  <text x="1135" y="309" class="m">id repo kind key text refs</text>
  <text x="1135" y="336" class="m">owner source forgotten created_at</text>
  <text x="1135" y="363" class="m">context_summary stated_at overridden</text>
  <text x="1135" y="390" class="b">created_at: when the row was inserted</text>
  <text x="1135" y="417" class="b">stated_at: original statement time</text>
  <text x="1135" y="444" class="b">overridden: previous id → earlier chain</text>
  <text x="1135" y="471" class="b">Current: newest row per repo + key;</text>
  <text x="1135" y="498" class="b">this repo + global, not forgotten</text>
  <text x="1135" y="525" class="b">Summary rebuilt from current notes</text>
  <text x="1135" y="552" class="b">Versioned references + inert assets</text>
  <text x="1135" y="579" class="b">live in the same database</text>

  <!-- Card 4: hybrid search -->
  <rect x="1115" y="720" width="430" height="480" rx="16" class="card"/>
  <circle cx="1151" cy="762" r="18" fill="#c2410c"/>
  <text x="1151" y="769" class="num" text-anchor="middle">4</text>
  <text x="1185" y="770" class="h">Hybrid search</text>
  <line x1="1135" y1="792" x2="1525" y2="792" class="rule"/>
  <text x="1135" y="828" class="s">FTS5 BM25 keyword search, always on</text>
  <text x="1135" y="855" class="b">Opt-in: Qwen embeddings + reranker</text>
  <text x="1135" y="882" class="b">cosine ≥ 0.35, RRF k = 60, then rerank</text>
  <text x="1135" y="909" class="b">Either stage fails → keyword only</text>
  <text x="1135" y="936" class="b">4s semantic budget; 3s embed HTTP</text>
  <text x="1135" y="963" class="b">Rerank: 16s queue + 8s inference;</text>
  <text x="1135" y="990" class="b">25s request budget, ≤ 64 candidates</text>
  <text x="1135" y="1017" class="s">/memory hybrid on: setup + verify</text>
  <text x="1135" y="1044" class="b">Downloads both models explicitly</text>
  <text x="1135" y="1071" class="b">Startup: cached models only</text>
  <text x="1135" y="1098" class="b">/memory hybrid off: keywords only</text>
  <text x="1135" y="1125" class="b">Endpoints receive query + note context,</text>
  <text x="1135" y="1152" class="b">never chat credentials. Vectors cached</text>

  <!-- Card 5: recall message -->
  <rect x="585" y="720" width="430" height="480" rx="16" class="card"/>
  <circle cx="621" cy="762" r="18" fill="#be185d"/>
  <text x="621" y="769" class="num" text-anchor="middle">5</text>
  <text x="655" y="770" class="h">Recall message</text>
  <line x1="605" y1="792" x2="995" y2="792" class="rule"/>
  <text x="605" y="828" class="b">Built per query; only what is new</text>
  <text x="605" y="855" class="s">1. Correction notices first:</text>
  <text x="605" y="882" class="b">replaced, or "no longer applies"</text>
  <text x="605" y="909" class="s">2. Up to 3 named reference hints</text>
  <text x="605" y="936" class="b">even when ordinary quotas are zero</text>
  <text x="605" y="963" class="s">3. Unseen summary + must-load notes</text>
  <text x="605" y="990" class="b">within summary_max_tokens</text>
  <text x="605" y="1017" class="s">4. Matches: 10 instructions, 10 gotchas;</text>
  <text x="605" y="1044" class="b">5 each: facts, decisions, references</text>
  <text x="605" y="1071" class="s">TOTAL: memory_max_tokens (4000),</text>
  <text x="605" y="1098" class="b">≈ chars/4, header included</text>
  <text x="605" y="1125" class="b">Seen IDs in saved provider history;</text>
  <text x="605" y="1152" class="b">compaction drops them → resend</text>

  <!-- Card 6: memory tool -->
  <rect x="55" y="720" width="430" height="480" rx="16" class="card"/>
  <circle cx="91" cy="762" r="18" fill="#475569"/>
  <text x="91" y="769" class="num" text-anchor="middle">6</text>
  <text x="125" y="770" class="h">memory tool (agent)</text>
  <line x1="75" y1="792" x2="465" y2="792" class="rule"/>
  <text x="75" y="828" class="s">search · get · load · history · forget</text>
  <text x="75" y="855" class="b">No save action; hooks handle saving</text>
  <text x="75" y="882" class="b">Scope repo: repo + global notes</text>
  <text x="75" y="909" class="b">Scope global: global notes only</text>
  <text x="75" y="936" class="b">History and forget use the exact scope</text>
  <text x="75" y="963" class="b">get: one version, full provenance,</text>
  <text x="75" y="990" class="b">current or superseded state</text>
  <text x="75" y="1017" class="b">history: full versions, newest first,</text>
  <text x="75" y="1044" class="b">default 20, max 50; truncation shown</text>
  <text x="75" y="1071" class="b">since / until: inclusive RFC3339</text>
  <text x="75" y="1098" class="b">bounds on stated_at</text>
  <text x="75" y="1125" class="b">load: full procedure + inert assets</text>
  <text x="75" y="1152" class="b">No auto-execution; forget on request</text>

  <!-- Data flow -->
  <path d="M487,330 L573,330" class="flow"/>
  <polygon points="583,330 569.0,337.0 569.0,323.0" fill="#475569"/>
  <text x="535" y="296" class="l" text-anchor="middle">query</text>
  <text x="535" y="318" class="l" text-anchor="middle">+ reply</text>
  <path d="M1017,300 L1103,300" class="flow"/>
  <polygon points="1113,300 1099.0,307.0 1099.0,293.0" fill="#475569"/>
  <text x="1065" y="266" class="l" text-anchor="middle">new</text>
  <text x="1065" y="288" class="l" text-anchor="middle">notes</text>
  <path d="M1113,400 L1027,400" class="flow"/>
  <polygon points="1017,400 1031.0,393.0 1031.0,407.0" fill="#475569"/>
  <text x="1065" y="430" class="l" text-anchor="middle">existing</text>
  <text x="1065" y="452" class="l" text-anchor="middle">notes</text>
  <path d="M1400,602 L1400,706" class="flow"/>
  <polygon points="1400,716 1393.0,702.0 1407.0,702.0" fill="#475569"/>
  <text x="1414" y="666" class="l" text-anchor="start">current notes</text>
  <path d="M1180,602 L1180,680 L930,680 L930,706" class="flow"/>
  <polygon points="930,716 923.0,702.0 937.0,702.0" fill="#475569"/>
  <rect x="957" y="653" width="197" height="24" fill="#f8fafc"/>
  <text x="1055" y="670" class="l" text-anchor="middle">corrections + summary</text>
  <path d="M1113,980 L1027,980" class="flow"/>
  <polygon points="1017,980 1031.0,973.0 1031.0,987.0" fill="#475569"/>
  <text x="1065" y="946" class="l" text-anchor="middle">ranked</text>
  <text x="1065" y="968" class="l" text-anchor="middle">matches</text>
  <path d="M340,602 L340,680 L650,680 L650,706" class="flow"/>
  <polygon points="650,716 643.0,702.0 657.0,702.0" fill="#475569"/>
  <rect x="466" y="653" width="59" height="24" fill="#f8fafc"/>
  <text x="495" y="670" class="l" text-anchor="middle">query</text>
  <path d="M800,716 L800,640 L420,640 L420,614" class="flow"/>
  <polygon points="420,604 427.0,618.0 413.0,618.0" fill="#475569"/>
  <rect x="490" y="613" width="240" height="24" fill="#f8fafc"/>
  <text x="610" y="630" class="l" text-anchor="middle">memory message (SetMemory)</text>
  <path d="M150,612 L150,706" class="flow"/>
  <polygon points="150,716 143.0,702.0 157.0,702.0" fill="#475569"/><polygon points="150,602 157.0,616.0 143.0,616.0" fill="#475569"/>
  <text x="164" y="666" class="l" text-anchor="start">tool call ⇄ result</text>
  <path d="M230,1212 L230,1232 L1290,1232 L1290,1212" class="flow"/>
  <polygon points="1290,1202 1297.0,1216.0 1283.0,1216.0" fill="#475569"/><polygon points="230,1202 237.0,1216.0 223.0,1216.0" fill="#475569"/>
  <rect x="597" y="1223" width="326" height="24" fill="#f8fafc"/>
  <text x="760" y="1240" class="l" text-anchor="middle">search ⇄ ranked matches (via card 4)</text>
  <path d="M110,1212 L110,1268 L1575,1268 L1575,360 L1557,360" class="flow"/>
  <polygon points="1547,360 1561.0,353.0 1561.0,367.0" fill="#475569"/><polygon points="110,1202 117.0,1216.0 103.0,1216.0" fill="#475569"/>
  <rect x="477" y="1259" width="566" height="24" fill="#f8fafc"/>
  <text x="760" y="1276" class="l" text-anchor="middle">get · load · history read; forget appends a tombstone (card 3)</text>

  <!-- Control surface -->
  <rect x="55" y="1294" width="1490" height="166" rx="14" class="foot"/>
  <text x="80" y="1330" class="h">Control surface</text>
  <text x="80" y="1364" class="b">~/.kh/config.json: memory_model ("" = chat model, "off" = no automatic saving) · summary_max_tokens 2500 · memory_max_tokens 4000</text>
  <text x="80" y="1391" class="b">top_instructions 10 · top_gotchas 10 · top_knowledge 5 · memory_hybrid false by default · embedding/model/reranker overrides optional</text>
  <text x="80" y="1418" class="b">CLI: kh memory list | search | explain | status | get | history | remember | forget | purge | import-md | reference</text>
  <text x="80" y="1445" class="b">forget appends a tombstone row and keeps history · purge deletes every version and its cached vectors</text>
</svg>
