<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" font-family="Helvetica, Arial, sans-serif">
  <title>kh memory architecture</title>
  <desc>Selective memory hooks, append-only provenance, scoped hybrid retrieval and bounded chat context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 19px; fill: #475569; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .rule { stroke: #e2e8f0; stroke-width: 1.5; }
      .num { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .b { font-size: 18px; fill: #334155; }
      .s { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .m { font-size: 17px; fill: #0f172a; font-family: Menlo, Consolas, monospace; }
      .l { font-size: 17px; fill: #334155; font-weight: 600; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; }
      .foot { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1400" fill="#f8fafc"/>
  <text x="55" y="62" class="title">kh memory architecture</text>
  <text x="55" y="94" class="sub">Selective, append-only, local SQLite memory. Arrows show the direction of data flow.</text>

  <!-- Card 1: chat turn -->
  <rect x="55" y="120" width="430" height="480" rx="16" class="card"/>
  <circle cx="91" cy="162" r="18" fill="#2563eb"/>
  <text x="91" y="169" class="num" text-anchor="middle">1</text>
  <text x="125" y="170" class="h">Chat turn</text>
  <line x1="75" y1="192" x2="465" y2="192" class="rule"/>
  <text x="75" y="228" class="s">Every nonempty user query:</text>
  <text x="75" y="255" class="b">initial, steering or queued</text>
  <text x="75" y="282" class="b">After images, before provider.Step,</text>
  <text x="75" y="309" class="b">BeforeMessage does two things:</text>
  <text x="75" y="336" class="b">• queues the pre-hook (card 2)</text>
  <text x="75" y="363" class="b">• recalls memory now (card 5)</text>
  <text x="75" y="390" class="b">A recall error aborts the message</text>
  <text x="75" y="444" class="s">When a turn completes:</text>
  <text x="75" y="471" class="b">• post-hook, if the reply is nonempty</text>
  <text x="75" y="498" class="b">• summary rebuild check</text>
  <text x="75" y="525" class="b">Recent context: bounded last exchange,</text>
  <text x="75" y="552" class="b">not a second transcript archive</text>

  <!-- Card 2: hooks -->
  <rect x="585" y="120" width="430" height="480" rx="16" class="card"/>
  <circle cx="621" cy="162" r="18" fill="#7c3aed"/>
  <text x="621" y="169" class="num" text-anchor="middle">2</text>
  <text x="655" y="170" class="h">Selective hooks</text>
  <line x1="605" y1="192" x2="995" y2="192" class="rule"/>
  <text x="605" y="228" class="b">One background worker, jobs in order</text>
  <text x="605" y="255" class="b">Tool-less memory_model call, JSON out</text>
  <text x="605" y="282" class="s">Pre-hook: query + recent context</text>
  <text x="605" y="309" class="s">Post-hook: query + recent context</text>
  <text x="605" y="336" class="b">+ tool evidence + final reply</text>
  <text x="605" y="390" class="s">Saves only durable knowledge:</text>
  <text x="605" y="417" class="b">instruction · fact · decision · gotcha</text>
  <text x="605" y="444" class="b">Routine discussion: {"save":[]}</text>
  <text x="605" y="471" class="b">Each note keeps a context_summary</text>
  <text x="605" y="498" class="b">Rejected: stale reads, hook kind changes,</text>
  <text x="605" y="525" class="b">secrets; peer messages are not learned</text>
  <text x="605" y="552" class="b">Every save shows as a (memory) notice</text>
  <text x="605" y="579" class="b">User chats learn; workers only retrieve</text>

  <!-- Card 3: store -->
  <rect x="1115" y="120" width="430" height="480" rx="16" class="card"/>
  <circle cx="1151" cy="162" r="18" fill="#0f766e"/>
  <text x="1151" y="169" class="num" text-anchor="middle">3</text>
  <text x="1185" y="170" class="h">SQLite store</text>
  <line x1="1135" y1="192" x2="1525" y2="192" class="rule"/>
  <text x="1135" y="228" class="b">~/.kh/memory.db, append-only notes:</text>
  <text x="1135" y="255" class="b">a change adds a row, never edits one</text>
  <text x="1135" y="282" class="s">Columns:</text>
  <text x="1135" y="309" class="m">id repo kind key text refs</text>
  <text x="1135" y="336" class="m">owner source forgotten created_at</text>
  <text x="1135" y="363" class="m">context_summary stated_at overridden</text>
  <text x="1135" y="390" class="b">created_at: when the row was inserted</text>
  <text x="1135" y="417" class="b">stated_at: original statement time</text>
  <text x="1135" y="444" class="b">overridden: previous id → earlier chain</text>
  <text x="1135" y="471" class="b">Current: newest row per repo + key;</text>
  <text x="1135" y="498" class="b">this repo + global, not forgotten</text>
  <text x="1135" y="525" class="b">Summary: separate row, rebuilt from</text>
  <text x="1135" y="552" class="b">current notes, never the old summary</text>

  <!-- Card 4: hybrid search -->
  <rect x="1115" y="670" width="430" height="480" rx="16" class="card"/>
  <circle cx="1151" cy="712" r="18" fill="#c2410c"/>
  <text x="1151" y="719" class="num" text-anchor="middle">4</text>
  <text x="1185" y="720" class="h">Hybrid search</text>
  <line x1="1135" y1="742" x2="1525" y2="742" class="rule"/>
  <text x="1135" y="778" class="s">FTS5 BM25 keyword search, always on</text>
  <text x="1135" y="805" class="b">+ optional Ollama embeddings,</text>
  <text x="1135" y="832" class="b">cosine ≥ 0.35, fused by RRF k = 60</text>
  <text x="1135" y="859" class="b">4s semantic budget, 3s HTTP timeout;</text>
  <text x="1135" y="886" class="b">embedding failure → keyword only</text>
  <text x="1135" y="913" class="b">Vector cache notes_vectors:</text>
  <text x="1135" y="940" class="m">note_id model content_hash vector</text>
  <text x="1135" y="967" class="s">Opt-in: BOTH memory_embedding_url</text>
  <text x="1135" y="994" class="b">(explicit /api/embed) and</text>
  <text x="1135" y="1021" class="s">memory_embedding_model. Default: off</text>
  <text x="1135" y="1048" class="b">A configured endpoint receives query,</text>
  <text x="1135" y="1075" class="b">note and context text. No model</text>
  <text x="1135" y="1102" class="b">download, no chat credentials sent</text>

  <!-- Card 5: recall message -->
  <rect x="585" y="670" width="430" height="480" rx="16" class="card"/>
  <circle cx="621" cy="712" r="18" fill="#be185d"/>
  <text x="621" y="719" class="num" text-anchor="middle">5</text>
  <text x="655" y="720" class="h">Recall message</text>
  <line x1="605" y1="742" x2="995" y2="742" class="rule"/>
  <text x="605" y="778" class="b">Built per query; only what is new</text>
  <text x="605" y="805" class="s">1. Correction notices first:</text>
  <text x="605" y="832" class="b">replaced, or "no longer applies"</text>
  <text x="605" y="859" class="s">2. Unseen summary + must-load refs</text>
  <text x="605" y="886" class="b">within summary_max_tokens</text>
  <text x="605" y="913" class="s">3. Matched notes, default maxima:</text>
  <text x="605" y="940" class="b">10 instructions, 10 gotchas, 5 per fact/decision</text>
  <text x="605" y="967" class="s">TOTAL: memory_max_tokens (4000),</text>
  <text x="605" y="994" class="b">≈ chars/4, header included</text>
  <text x="605" y="1048" class="b">Seen IDs: [memory #id] markers in</text>
  <text x="605" y="1075" class="b">saved provider history. Compaction</text>
  <text x="605" y="1102" class="b">drops them, so notes are resent</text>

  <!-- Card 6: memory tool -->
  <rect x="55" y="670" width="430" height="480" rx="16" class="card"/>
  <circle cx="91" cy="712" r="18" fill="#475569"/>
  <text x="91" y="719" class="num" text-anchor="middle">6</text>
  <text x="125" y="720" class="h">memory tool (agent)</text>
  <line x1="75" y1="742" x2="465" y2="742" class="rule"/>
  <text x="75" y="778" class="s">search · get · history · forget</text>
  <text x="75" y="805" class="b">No save action; hooks handle saving</text>
  <text x="75" y="832" class="b">Scope repo: repo + global notes</text>
  <text x="75" y="859" class="b">Scope global: global notes only</text>
  <text x="75" y="886" class="b">History and forget use the exact scope</text>
  <text x="75" y="913" class="b">get: one version, full provenance,</text>
  <text x="75" y="940" class="b">current or superseded state</text>
  <text x="75" y="967" class="b">history: full versions, newest first,</text>
  <text x="75" y="994" class="b">default 20, max 50; truncation shown</text>
  <text x="75" y="1021" class="b">since / until: inclusive RFC3339</text>
  <text x="75" y="1048" class="b">bounds on stated_at</text>
  <text x="75" y="1075" class="b">order: relevance · newest · oldest</text>
  <text x="75" y="1102" class="b">forget only when the user asks</text>

  <!-- Data flow -->
  <line x1="487" y1="340" x2="581" y2="340" class="flow" marker-end="url(#arrow)"/>
  <text x="535" y="306" class="l" text-anchor="middle">query</text>
  <text x="535" y="328" class="l" text-anchor="middle">+ reply</text>
  <line x1="1017" y1="340" x2="1111" y2="340" class="flow" marker-end="url(#arrow)"/>
  <text x="1065" y="306" class="l" text-anchor="middle">durable</text>
  <text x="1065" y="328" class="l" text-anchor="middle">notes</text>
  <line x1="1330" y1="602" x2="1330" y2="666" class="flow" marker-end="url(#arrow)"/>
  <text x="1345" y="641" class="l">current notes</text>
  <line x1="1113" y1="920" x2="1019" y2="920" class="flow" marker-end="url(#arrow)"/>
  <text x="1065" y="886" class="l" text-anchor="middle">ranked</text>
  <text x="1065" y="908" class="l" text-anchor="middle">matches</text>
  <path d="M700,668 L700,630 L380,630 L380,604" class="flow" marker-end="url(#arrow)"/>
  <text x="650" y="656" class="l" text-anchor="middle">SetMemory, then provider.Step</text>
  <line x1="150" y1="602" x2="150" y2="666" class="flow" marker-end="url(#arrow)"/>
  <text x="164" y="641" class="l">tool calls</text>
  <path d="M270,1152 L270,1180 L1330,1180 L1330,1154" class="flow" marker-end="url(#arrow)"/>
  <rect x="680" y="1168" width="240" height="24" fill="#f8fafc"/>
  <text x="800" y="1186" class="l" text-anchor="middle">search ranks via card 4</text>

  <!-- Control surface -->
  <rect x="55" y="1210" width="1490" height="166" rx="14" class="foot"/>
  <text x="80" y="1246" class="h">Control surface</text>
  <text x="80" y="1280" class="b">~/.kh/config.json: memory_model ("" = chat model, "off" = no automatic saving) · summary_max_tokens 2500 · memory_max_tokens 4000</text>
  <text x="80" y="1307" class="b">top_instructions 10 · top_gotchas 10 · top_knowledge 5 · memory_embedding_url + memory_embedding_model (set both, or neither)</text>
  <text x="80" y="1334" class="b">CLI: kh memory list | search | explain | status | get | history | remember | forget | purge | import-md</text>
  <text x="80" y="1361" class="b">forget appends a tombstone row and keeps history · purge deletes every version and its cached vectors</text>
</svg>
